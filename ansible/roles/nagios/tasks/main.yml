- name: Install Nagios and plugins
  apt:
    name: [nagios4, nagios-plugins-basic, nagios-plugins-standard, apache2, apache2-utils]
    update_cache: true

- name: Enable Apache modules for the Nagios CGIs
  apache2_module: { name: "{{ item }}", state: present }
  loop: [cgi, authz_groupfile, auth_digest]
  notify: restart apache

- name: Nagios web admin login (digest auth)
  command: "htdigest -c /etc/nagios4/htdigest.users Nagios4 nagiosadmin"
  args: { stdin: "{{ nagios_password }}\n{{ nagios_password }}", creates: /etc/nagios4/htdigest.users }
  no_log: true
  notify: restart apache

- name: Monitor DropWatch app server
  template: { src: dropwatch.cfg.j2, dest: /etc/nagios4/conf.d/dropwatch.cfg }
  notify: restart nagios

- name: Start services
  systemd: { name: "{{ item }}", state: started, enabled: true }
  loop: [nagios4, apache2]
